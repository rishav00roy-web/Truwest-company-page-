<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Netlify form registration</title>
  <meta name="robots" content="noindex" />
</head>
<body>
  <!--
    Netlify detects forms by scanning static HTML in the publish directory at
    deploy time. The real forms are rendered by Next.js and live inside the
    server output, where that scan does not reliably reach them, so every form
    name is declared once here instead. This page is never linked or shown.

    Generated from src/data/locations.ts. If the city lists change, regenerate:
    the residential city forms skip DEDICATED_RESIDENTIAL_CITIES because those
    cities have hand-written pages that use the lead-form-<city> names above.
  -->
  <form name="lead-form" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="lead-form" />
    <input type="text" name="full_name" />
    <input type="text" name="email" />
    <input type="text" name="phone" />
    <input type="text" name="financing_goal" />
    <input type="text" name="value_range" />
    <input type="text" name="page_source" />
